[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-weather"
version = "2.0.0"
description = "Lakehouse weather pipeline with synthetic data generation"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.7"]
spark   = ["pyspark>=3.4"]
dev     = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
